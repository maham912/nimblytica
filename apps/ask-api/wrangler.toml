name = "valley-freight-ask"
main = "worker.js"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[assets]
directory = "../.."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = [ "/ask" ]

[[d1_databases]]
binding = "ASK_DB"
database_name = "valley-freight-ask"
database_id = "paste-the-id-from-wrangler-d1-create"

[vars]
ALLOWED_ORIGINS = ""
