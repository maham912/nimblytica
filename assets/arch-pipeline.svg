<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">People-analytics export to the Week Board</title>
  <desc id="archDesc">Visier export, Azure Data Factory, blob staging, Snowflake, then the Week Board. Power BI optional on the same grain.</desc>
  <rect width="920" height="240" fill="#0a0a0a"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2f2f2"/>
    </marker>
  </defs>
  <g font-family="Geist, ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="56" width="150" height="96" fill="#000" stroke="#2a2a2a"/>
    <text x="99" y="96" text-anchor="middle" fill="#f2f2f2" font-size="14" font-weight="600">Visier</text>
    <text x="99" y="118" text-anchor="middle" fill="#6e6e6e" font-size="12">export</text>

    <rect x="214" y="56" width="150" height="96" fill="#000" stroke="#2a2a2a"/>
    <text x="289" y="96" text-anchor="middle" fill="#f2f2f2" font-size="14" font-weight="600">Data Factory</text>
    <text x="289" y="118" text-anchor="middle" fill="#6e6e6e" font-size="12">scheduled copy</text>

    <rect x="404" y="56" width="150" height="96" fill="#000" stroke="#2a2a2a"/>
    <text x="479" y="96" text-anchor="middle" fill="#f2f2f2" font-size="14" font-weight="600">Blob</text>
    <text x="479" y="118" text-anchor="middle" fill="#6e6e6e" font-size="12">staging</text>

    <rect x="594" y="56" width="150" height="96" fill="#000" stroke="#2a2a2a"/>
    <text x="669" y="96" text-anchor="middle" fill="#f2f2f2" font-size="14" font-weight="600">Snowflake</text>
    <text x="669" y="118" text-anchor="middle" fill="#6e6e6e" font-size="12">warehouse</text>

    <rect x="784" y="28" width="116" height="70" fill="#000" stroke="#f2f2f2"/>
    <text x="842" y="68" text-anchor="middle" fill="#f2f2f2" font-size="13" font-weight="600">Week Board</text>

    <rect x="784" y="118" width="116" height="56" fill="#000" stroke="#2a2a2a"/>
    <text x="842" y="150" text-anchor="middle" fill="#a3a3a3" font-size="12">Power BI</text>
  </g>
  <line x1="174" y1="104" x2="214" y2="104" stroke="#f2f2f2" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="364" y1="104" x2="404" y2="104" stroke="#f2f2f2" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="554" y1="104" x2="594" y2="104" stroke="#f2f2f2" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="744" y1="90" x2="784" y2="62" stroke="#f2f2f2" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="744" y1="118" x2="784" y2="146" stroke="#6e6e6e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="24" y="214" fill="#6e6e6e" font-size="12" font-family="Geist, ui-sans-serif, system-ui, sans-serif">Unbranded pattern. Invented labels. Not a client diagram.</text>
</svg>
